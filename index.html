<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Cash Flow — Personal Financial Management</title>
    <meta name="description" content="Production-quality personal financial management web application for tracking loans, salary EMIs, Swiggy delivery earnings, expenses, and cash flow." />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta property="og:title" content="Cash Flow — Personal Financial Management" />
    <meta property="og:description" content="Production-quality personal financial management web application for tracking loans, salary EMIs, Swiggy delivery earnings, expenses, and cash flow." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('cashflow_theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F8FA] dark:bg-[#0B0F17] text-[#111827] dark:text-[#F3F4F6] antialiased selection:bg-slate-900 selection:text-white dark:selection:bg-blue-600">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
